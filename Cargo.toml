[workspace]
members = ["programs/*", "encrypted-ixs"]
resolver = "2"

[profile.release]
# Програма рахує депозит, внески й нарахування власникам. Тихе переповнення тут —
# це або недоплата донору, або виплата понад заблоковане, тому перевірки
# лишаються увімкненими і в релізі.
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
