# Deploys the landing page and `apps/web` to GitHub Pages, as one site:
#
#   /<repo>/       apps/landing — static, no build step, no JavaScript
#   /<repo>/app/   apps/web     — the app
#
# The landing is the first screen, so the app's bundle (Privy included) loads
# only once a visitor opens the app.
#
# The API, the program and the MPC cluster do not run on Pages. Without
# `VITE_API_URL` the app runs on its built-in fixtures and says so on screen —
# the M0 prototype, and the landing says the same next to its link. Point
# `VITE_API_URL` at a live API (repository variable) to switch the screens that
# already talk to it.
#
# One-time setup by the repository owner:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions".
#   Optional repository variables (Settings → Secrets and variables → Actions →
#   Variables): VITE_API_URL, VITE_PRIVY_APP_ID, VITE_RPC_URL, PAGES_BASE_PATH.
#   These are baked into the public bundle, so they are variables, not secrets.
#   PAGES_BASE_PATH is the app's path: "/app/" on a custom domain.

name: pages

on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - apps/landing/**
      - scripts/assemble-pages.sh
      - packages/shared/**
      - packages/crypto/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes a build still in flight.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from `packageManager` in package.json — one place to bump.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `vite build` does not type-check. A bundle that builds but does not
      # type-check is exactly the kind of thing that deploys green and then
      # renders a blank page.
      - run: pnpm --filter @genovault/web typecheck
      - run: pnpm --filter @genovault/web test

      # Project pages live under the repository name; a custom domain lives at
      # the root. The app sits one level down, in /app/. `PAGES_BASE_PATH`
      # overrides the default for a custom domain ("/app/").
      - name: Build the app
        env:
          BASE_PATH: ${{ vars.PAGES_BASE_PATH || format('/{0}/app/', github.event.repository.name) }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_PRIVY_APP_ID: ${{ vars.VITE_PRIVY_APP_ID }}
          VITE_RPC_URL: ${{ vars.VITE_RPC_URL }}
        run: pnpm --filter @genovault/web build

      # The landing at the root, the app under app/, and the landing's 404.html
      # as the site's only 404 page: Pages reads 404.html from the site root
      # alone. It hands deep links under /app/ back to the app (the app's router
      # is history-based, not hash-based) and shows "not found" for the rest.
      - name: Assemble the site
        env:
          BASE_PATH: ${{ vars.PAGES_BASE_PATH || format('/{0}/app/', github.event.repository.name) }}
        run: bash scripts/assemble-pages.sh "$BASE_PATH" _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
