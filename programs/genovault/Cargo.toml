[package]
name = "genovault"
version = "0.1.0"
edition = "2021"
description = "Конфіденційний маркетплейс медичних і геномних даних"

[lib]
crate-type = ["cdylib", "lib"]
name = "genovault"

[features]
default = []
# Оголошені, щоб `cargo` не вважав їх невідомими: макроси Anchor читають ці
# cfg самі, і без оголошення кожна збірка тоне у warning'ах про них.
anchor-debug = []
custom-heap = []
custom-panic = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "arcium-anchor/idl-build"]

[dependencies]
# Точна рівність, а не діапазон: arcium-anchor 0.14.1 залежить від
# anchor-lang =1.0.2, і будь-яке розходження тут ламає збірку каскадом.
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }
arcium-client = { version = "=0.14.1", default-features = false }
arcium-macros = "=0.14.1"
arcium-anchor = "=0.14.1"

[dev-dependencies]
# Стенд для тестів програми. `litesvm` тут не працює — падає з E0027 на
# сучасному Anchor (відоме). Mollusk бере вже зібраний .so, тому перевіряє
# рівно те, що поїде в мережу, разом із перевірками акаунтів від Anchor.
mollusk-svm = "=0.15.1"
solana-account = "4.3"
solana-sdk-ids = "3.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
