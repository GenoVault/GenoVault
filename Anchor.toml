[toolchain]
anchor_version = "1.0.2"
solana_version = "3.1.10"
package_manager = "pnpm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
genovault = "9G5ri75FHhrD5V4ujTwvmv5ULCSRTcu4x4mvzKk6tNEb"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "pnpm --filter @genovault/sdk test"

[hooks]

[test]
startup_wait = 5000
shutdown_wait = 2000
upgradeable = false

[test.validator]
bind_address = "127.0.0.1"
ledger = ".anchor/test-ledger"
rpc_port = 8899
# Ледер не обрізаємо. За замовчуванням валідатор тримає останні кількасот
# слотів, і історія транзакцій зникає раніше, ніж по неї приходить незалежний
# звіряч: `SC-001` перевіряє саме те, що поїхало в ланцюг, а не те, що в ньому
# лишилось. Число — межа в шредах, а не в байтах, і воно **рядок**: anchor
# віддає значення валідатору як аргумент і цілого числа тут не приймає.
limit_ledger_size = "100000000"
