[localnet]
# Двох вузлів достатньо, щоб властивість «жоден окремий вузол не відновлює дані»
# була справжньою, а не декларацією (FR-014). Більше вузлів — повільніший
# кожен прогін, а SC-003 дає 5 хвилин на 10 000 записів.
nodes = 2
nodes_ips = [
  [172, 20, 0, 100],
  [172, 20, 0, 101]
]
localnet_timeout_secs = 60
backends = ["Cerberus"]
